name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.4.1
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Release tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop

      - name: Check Rust formatting
        run: cargo fmt --all -- --check
        working-directory: desktop/src-tauri

      - name: Run Rust tests
        run: cargo test
        working-directory: desktop/src-tauri

      - name: Check Python sources
        run: python3 -m py_compile proxy/csswitch_proxy.py proxy/qwen_proxy.py

      - name: Check desktop JavaScript
        run: node --check desktop/src/main.js

      - name: Run project tests
        run: bash test/run_all.sh

  build-release:
    name: Build release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            install: rustup target add aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            install: ''
            args: ''
          - platform: ubuntu-22.04
            install: |
              sudo apt-get update
              sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev rpm
            args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install platform dependencies
        if: matrix.install != ''
        shell: bash
        run: ${{ matrix.install }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: CSSwitch ${{ env.RELEASE_TAG }}
          releaseBody: |
            Automated CSSwitch build for macOS, Windows, and Linux.

            macOS and Windows builds are unsigned unless signing secrets are configured.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
